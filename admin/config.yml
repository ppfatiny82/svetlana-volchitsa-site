backend:
  name: github
  repo: ppfatiny82/svetlana-volchitsa-site
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "database"
    label: "База данных сайта"
    files:
      - label: "🎵 Моя Музыка (Альбомы и треки)"
        name: "music"
        file: "content/music.json"
        fields:
          - label: "Мои альбомы"
            name: "albums"
            widget: "list"
            fields:
              - {label: "Название альбома", name: "title", widget: "string"}
              - {label: "Обложка альбома", name: "cover", widget: "image"}
              - label: "Песни в альбоме"
                name: "tracks"
                widget: "list"
                fields:
                  - {label: "Название песни", name: "track_title", widget: "string"}
                  - {label: "Аудиофайл (MP3)", name: "audio", widget: "file"}
                  - {label: "Обложка песни (если отличается от альбома)", name: "track_cover", widget: "image", required: false}
                  - {label: "Текст песни", name: "lyrics", widget: "text", required: false}

      - label: "⚙️ Настройки сайта"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "Главное фото (где вы на стуле)", name: "main_photo", widget: "image", required: false}
          - {label: "Текст 'О певице'", name: "about_text", widget: "text", required: false}
          - {label: "Своя иконка ВКонтакте", name: "vk_icon", widget: "image", required: false}
          - {label: "Ссылка ВКонтакте", name: "vk_link", widget: "string", required: false}
          - {label: "Ссылка Яндекс Музыка", name: "yandex_link", widget: "string", required: false}
          - {label: "Ссылка на Telegram стикеры", name: "tg_link", widget: "string", required: false}
