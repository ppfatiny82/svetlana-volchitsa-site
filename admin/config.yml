backend:
  name: github
  repo: ppfatiny82/svetlana-volchitsa-site
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Настройки и фото сайта"
    files:
      - file: "content/settings.json"
        label: "Основные данные и стикеры"
        name: "settings"
        fields:
          - { label: "Главное фото на обложке", name: "hero_photo", widget: "image", required: false }
          - { label: "Фото в блоке 'О певице'", name: "main_photo", widget: "image", required: false }
          - { label: "Текст 'О певице'", name: "about_text", widget: "text", required: false }
          - { label: "Название свежего сингла на фото", name: "featured_single_title", widget: "string", default: "«Ночной дожор»", required: false }
          - { label: "Ссылка на Telegram-канал", name: "tg_channel_link", widget: "string", required: false }
          - { label: "Ссылка на стикерпак в Telegram", name: "tg_stickers_link", widget: "string", required: false }
          - { label: "Сообщество ВКонтакте", name: "vk_link", widget: "string", required: false }
          - { label: "VK Музыка", name: "vk_music_link", widget: "string", required: false }
          - { label: "Яндекс Музыка", name: "yandex_link", widget: "string", required: false }
          - { label: "Звук (Сбер)", name: "zvuk_link", widget: "string", required: false }
          - { label: "Apple Music", name: "apple_music_link", widget: "string", required: false }
          - { label: "Spotify", name: "spotify_link", widget: "string", required: false }
          - { label: "Band.link", name: "bandlink_link", widget: "string", required: false }
          - { label: "YouTube", name: "youtube_link", widget: "string", required: false }
          
          # 6 стикеров: названия и картинки для каждого
          - { label: "Стикер 1 — Название", name: "sticker_1_title", widget: "string", default: "«Приветики!»", required: false }
          - { label: "Стикер 1 — Картинка", name: "sticker_1", widget: "image", required: false }

          - { label: "Стикер 2 — Название", name: "sticker_2_title", widget: "string", default: "«Огонь!»", required: false }
          - { label: "Стикер 2 — Картинка", name: "sticker_2", widget: "image", required: false }

          - { label: "Стикер 3 — Название", name: "sticker_3_title", widget: "string", default: "«Букет роз»", required: false }
          - { label: "Стикер 3 — Картинка", name: "sticker_3", widget: "image", required: false }

          - { label: "Стикер 4 — Название", name: "sticker_4_title", widget: "string", default: "«Красивая жизнь»", required: false }
          - { label: "Стикер 4 — Картинка", name: "sticker_4", widget: "image", required: false }

          - { label: "Стикер 5 — Название", name: "sticker_5_title", widget: "string", default: "«С любовью»", required: false }
          - { label: "Стикер 5 — Картинка", name: "sticker_5", widget: "image", required: false }

          - { label: "Стикер 6 — Название", name: "sticker_6_title", widget: "string", default: "«Взгляд Волчицы»", required: false }
          - { label: "Стикер 6 — Картинка", name: "sticker_6", widget: "image", required: false }

 - name: "music"
    label: "Дискография и треки"
    files:
      - file: "playlist.json"
        label: "Альбом и песни"
        name: "album_tracks"
        fields:
          - { label: "Название альбома", name: "album_title", widget: "string", default: "КРАСИВАЯ ЖИЗНЬ" }
          - { label: "Год выпуска альбома", name: "album_year", widget: "string", default: "2026" }
          - { label: "Обложка альбома", name: "album_cover", widget: "image" }
          - label: "Песни альбома"
            name: "tracks"
            widget: "list"
            fields:
              - { label: "Название песни", name: "title", widget: "string" }
              - { label: "Аудиофайл (MP3)", name: "file", widget: "file" }
              - { label: "Обложка песни (если отличается от альбома)", name: "cover", widget: "image", required: false }
              - { label: "Длительность", name: "duration", widget: "string", default: "3:30" }
              - { label: "Текст песни", name: "lyrics", widget: "text", required: false }

  - name: "faq"
    label: "Вопрос-ответ (FAQ)"
    files:
      - file: "content/faq.json"
        label: "Вопросы и ответы"
        name: "faq"
        fields:
          - label: "Список вопросов"
            name: "items"
            widget: "list"
            fields:
              - { label: "Вопрос", name: "question", widget: "string" }
              - { label: "Ответ", name: "answer", widget: "text" }

  - name: "videos"
    label: "Видеоклипы на главной"
    files:
      - file: "content/videos.json"
        label: "4 клипа на главной"
        name: "videos_main"
        fields:
          - { label: "1. Название клипа", name: "v1_title", widget: "string" }
          - { label: "1. Бейджик (Хит, Премьера...)", name: "v1_badge", widget: "string" }
          - { label: "1. Описание", name: "v1_desc", widget: "string" }
          - { label: "1. Ссылка на YouTube", name: "v1_url", widget: "string" }

          - { label: "2. Название клипа", name: "v2_title", widget: "string" }
          - { label: "2. Бейджик (Лирика, Драма...)", name: "v2_badge", widget: "string" }
          - { label: "2. Описание", name: "v2_desc", widget: "string" }
          - { label: "2. Ссылка на YouTube", name: "v2_url", widget: "string" }

          - { label: "3. Название клипа", name: "v3_title", widget: "string" }
          - { label: "3. Бейджик", name: "v3_badge", widget: "string" }
          - { label: "3. Описание", name: "v3_desc", widget: "string" }
          - { label: "3. Ссылка на YouTube", name: "v3_url", widget: "string" }

          - { label: "4. Название клипа", name: "v4_title", widget: "string" }
          - { label: "4. Бейджик", name: "v4_badge", widget: "string" }
          - { label: "4. Описание", name: "v4_desc", widget: "string" }
          - { label: "4. Ссылка на YouTube", name: "v4_url", widget: "string" }
