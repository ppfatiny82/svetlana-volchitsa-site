backend:
  name: github
  repo: ppfatiny82/svetlana-volchitsa-site
  branch: main

media_folder: "uploads"
public_folder: "uploads"

collections:
  - name: "content"
    label: "Контент сайта"
    files:
      - label: "Плейлист"
        name: "playlist"
        file: "playlist.json"
        fields:
          - label: "Мои песни"
            name: "tracks"
            widget: "list"
            fields:
              - {label: "Название трека", name: "title", widget: "string"}
              - {label: "Аудиофайл (WAV/MP3)", name: "audio", widget: "file"}
              - {label: "Обложка", name: "cover", widget: "image"}
              - {label: "Текст песни", name: "lyrics", widget: "text", required: false}
