backend:
  name: github
  repo: ppfatiny82/svetlana-volchitsa-site
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "database"
    label: "База данных сайта"
    files:
      - label: "🎵 Моя Музыка (Альбомы и треки)"
        name: "music"
        file: "content/music.json"
        fields:
          - label: "Мои альбомы и релизы"
            name: "albums"
            widget: "list"
            fields:
              - {label: "Название альбома/сингла", name: "title", widget: "string"}
              - {label: "Обложка альбома", name: "cover", widget: "image"}
              - label: "Список песен в альбоме"
                name: "tracks"
                widget: "list"
                fields:
                  - {label: "Название песни", name: "track_title", widget: "string"}
                  - {label: "Обложка песни", name: "track_cover", widget: "image", required: false}
                  - {label: "Аудиофайл (MP3)", name: "audio", widget: "file"}
                  - {label: "Текст песни", name: "lyrics", widget: "text", required: false}

      - label: "⚙️ Настройки и фото сайта"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "Главное фото на обложке", name: "hero_photo", widget: "image", required: false}
          - {label: "Фото в блоке 'О певице'", name: "main_photo", widget: "image", required: false}
          - {label: "Текст 'О певице'", name: "about_text", widget: "text", required: false}
          - {label: "Название свежего сингла на фото", name: "fresh_single_title", widget: "string", required: false}
          - {label: "Ссылка на Telegram-канал", name: "tg_channel_link", widget: "string", required: false}
          - {label: "Ссылка на ВКонтакте (Сообщество)", name: "vk_link", widget: "string", required: false}
          - {label: "Ссылка на VK Музыку", name: "vk_music_link", widget: "string", required: false}
          - {label: "Ссылка на Яндекс Музыку", name: "yandex_link", widget: "string", required: false}
          - {label: "Ссылка на Звук (zvuk.com)", name: "zvuk_link", widget: "string", required: false}
          - {label: "Ссылка на Apple Music", name: "apple_music_link", widget: "string", required: false}
          - {label: "Ссылка на Spotify", name: "spotify_link", widget: "string", required: false}
          - {label: "Ссылка на Band.link", name: "bandlink_link", widget: "string", required: false}
          - {label: "Ссылка на YouTube", name: "youtube_link", widget: "string", required: false}
          - {label: "Ссылка на стикерпак Telegram", name: "tg_stickers_link", widget: "string", required: false}
          
          # Управление 6 стикерами
          - {label: "Стикер 1 («Приветики!»)", name: "sticker_1", widget: "image", required: false}
          - {label: "Стикер 2 («Огонь!»)", name: "sticker_2", widget: "image", required: false}
          - {label: "Стикер 3 («Букет роз»)", name: "sticker_3", widget: "image", required: false}
          - {label: "Стикер 4 («Красивая жизнь»)", name: "sticker_4", widget: "image", required: false}
          - {label: "Стикер 5 («С любовью»)", name: "sticker_5", widget: "image", required: false}
          - {label: "Стикер 6 («Взгляд Волчицы»)", name: "sticker_6", widget: "image", required: false}

      - label: "❓ Вопросы и ответы (FAQ)"
        name: "faq"
        file: "content/faq.json"
        fields:
          - label: "Список вопросов и ответов"
            name: "questions"
            widget: "list"
            fields:
              - {label: "Вопрос", name: "question", widget: "string"}
              - {label: "Ответ", name: "answer", widget: "text"}
