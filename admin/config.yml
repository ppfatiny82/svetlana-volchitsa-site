backend:
  name: github
  repo: ppfatiny82/svetlana-volchitsa-site
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "database"
    label: "Базы данных"
    files:
      - label: "🎵 Моя Музыка (Альбомы)"
        name: "music"
        file: "content/music.json"
        fields:
          - label: "Мои альбомы"
            name: "albums"
            widget: "list"
            fields:
              - {label: "Название альбома", name: "title", widget: "string"}
              - {label: "Обложка альбома", name: "cover", widget: "image"}
              - label: "Песни в альбоме"
                name: "tracks"
                widget: "list"
                fields:
                  - {label: "Название песни", name: "track_title", widget: "string"}
                  - {label: "Аудиофайл (MP3)", name: "audio", widget: "file"}
                  - {label: "Обложка песни", name: "track_cover", widget: "image", required: false}
