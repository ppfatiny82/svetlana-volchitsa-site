<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Светлана Волчица — Официальный сайт певицы</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stage: '#0B0B0E',
                        panel: '#15151C',
                        panelHover: '#1E1E28',
                        gold: '#D4AF37',
                        goldLight: '#F5D77F',
                        goldShine: '#FFE082',
                        crimson: '#E11D48',
                        crimsonDark: '#9F1239'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0B0E; }
        ::-webkit-scrollbar-thumb { background: #2A2A38; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        
        .gold-glow { box-shadow: 0 0 35px -5px rgba(212, 175, 55, 0.35); }
        .glass-header { background: rgba(11, 11, 14, 0.92); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .glass-card { background: rgba(21, 21, 28, 0.82); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card:hover { border-color: rgba(212, 175, 55, 0.35); }
        .gold-gradient-text { background: linear-gradient(135deg, #FFE57F 0%, #FFD54F 25%, #FFA000 50%, #FFD54F 75%, #FFE57F 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.3)); }
        
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.04); } }
        .ambient-glow { animation: pulseGlow 6s ease-in-out infinite; }
    </style>
</head>
<body class="bg-stage text-zinc-100 antialiased min-h-screen selection:bg-crimson selection:text-white pb-28">

    <!-- Фоновые эффекты освещения -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 left-1/4 w-96 h-96 bg-crimson/15 rounded-full blur-3xl ambient-glow"></div>
        <div class="absolute top-1/3 -right-20 w-96 h-96 bg-gold/15 rounded-full blur-3xl ambient-glow" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-20 left-10 w-80 h-80 bg-purple-900/20 rounded-full blur-3xl ambient-glow" style="animation-delay: 4s;"></div>
    </div>

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-40 w-full glass-header border-b border-zinc-800/80 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="#top" class="flex items-center gap-2 flex-shrink-0 group">
                <span class="text-2xl font-bold gold-gradient-text tracking-widest uppercase">Светлана Волчица</span>
            </a>
            <a href="/svetlana-volchitsa-site/admin/" class="text-sm text-zinc-400 hover:text-gold transition-colors">Вход в админку</a>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="relative z-10 max-w-4xl mx-auto px-4 mt-12">
        
        <!-- Плеер -->
        <div class="glass-card rounded-2xl p-6 mb-12 gold-glow flex flex-col md:flex-row items-center gap-8">
            <img id="cover" src="" alt="Обложка" class="w-48 h-48 object-cover rounded-xl hidden shadow-lg">
            <div class="flex-grow w-full">
                <h2 id="track-title" class="text-2xl font-bold mb-6 gold-gradient-text text-center md:text-left">Выберите песню из плейлиста</h2>
                <audio id="audio-player" controls class="w-full outline-none"></audio>
            </div>
        </div>

        <!-- Список треков (подтягивается из админки) -->
        <div class="space-y-4" id="playlist">
            <div class="glass-card rounded-xl p-8 text-center">
                <p class="text-zinc-400">Плейлист загружается...</p>
            </div>
        </div>

    </main>

    <script>
        // Скрипт для связи вашей красивой оболочки с админкой
        fetch('playlist.json')
            .then(response => response.json())
            .then(data => {
                const playlistDiv = document.getElementById('playlist');
                const tracks = data.tracks || [];

                if (tracks.length === 0) {
                    playlistDiv.innerHTML = '<div class="glass-card rounded-xl p-8 text-center"><p class="text-zinc-400">Треков пока нет. Зайдите в Панель управления (кнопка в правом верхнем углу) и загрузите свою музыку!</p></div>';
                    return;
                }

                playlistDiv.innerHTML = ''; 

                tracks.forEach((track, index) => {
                    const trackEl = document.createElement('div');
                    // Дизайн каждой карточки трека (как на вашем скриншоте)
                    trackEl.className = 'glass-card rounded-xl p-4 flex items-center gap-6 cursor-pointer transition-all hover:bg-panelHover';
                    trackEl.onclick = () => playTrack(track);
                    
                    const num = (index + 1).toString().padStart(2, '0');
                    
                    trackEl.innerHTML = `
                        <span class="text-gold/50 font-mono font-bold text-lg w-8 text-center">${num}</span>
                        ${track.cover ? `<img src="${track.cover.startsWith('/') ? track.cover : '/' + track.cover}" class="w-12 h-12 rounded object-cover">` : ''}
                        <div class="flex-grow">
                            <h3 class="font-bold text-zinc-100 text-lg">${track.title}</h3>
                            <p class="text-sm text-zinc-500 mt-1">СВЕТЛАНА ВОЛЧИЦА</p>
                        </div>
                        <button class="px-5 py-2 border border-zinc-700 text-zinc-300 hover:border-crimson hover:text-crimson rounded-lg transition-colors text-sm font-bold">Слушать</button>
                    `;
                    playlistDiv.appendChild(trackEl);
                });
            })
            .catch(error => {
                document.getElementById('playlist').innerHTML = '<div class="glass-card rounded-xl p-8 text-center"><p class="text-crimson">Ошибка загрузки плейлиста.</p></div>';
                console.error(error);
            });

        function playTrack(track) {
            document.getElementById('track-title').innerText = track.title;
            const audioPlayer = document.getElementById('audio-player');
            
            let audioPath = track.audio;
            if (audioPath && !audioPath.startsWith('http')) {
               audioPath = audioPath.startsWith('/') ? audioPath : '/' + audioPath;
            }
            audioPlayer.src = audioPath;

            const coverImg = document.getElementById('cover');
            if (track.cover) {
                let coverPath = track.cover;
                if (!coverPath.startsWith('http')) {
                    coverPath = coverPath.startsWith('/') ? coverPath : '/' + coverPath;
                }
                coverImg.src = coverPath;
                coverImg.classList.remove('hidden');
            } else {
                coverImg.classList.add('hidden');
            }

            audioPlayer.play();
        }
    </script>
</body>
</html>
